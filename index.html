<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentic-prs — campo de pruebas</title>
  <style>
    :root {
      --bg: #fbfaf9;
      --fg: #1f1e1d;
      --muted: #6b6866;
      --line: #e3e0dc;
      --accent: #c15f3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.5rem;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main { max-width: 34rem; margin: 0 auto; }
    h1 { font-size: 3rem; margin: 0 0 .25rem; }
    p.lead { color: var(--muted); margin: 0 0 2rem; }
    section {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: #fff;
    }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); margin: 0 0 .75rem; }
    button {
      font: inherit;
      padding: .5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #count { font-variant-numeric: tabular-nums; margin-left: .75rem; color: var(--muted); }
    ul { margin: 0; padding-left: 1.2rem; }
    li { margin: .2rem 0; }
    footer { margin-top: 2rem; color: var(--muted); font-size: .85rem; }
    #dog-wrap { display: flex; flex-direction: column; align-items: center; }
    #dog { width: 160px; height: 160px; }
    #dog.jump { animation: dog-jump .5s ease; }
    @keyframes dog-jump {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(-40px); }
      60%  { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gonzalo</h1>
    <p class="lead">Página estática de pruebas. Abre una issue mencionando
      <code>@claude</code> y deja que la modifique.</p>

    <section>
      <h2>Contador</h2>
      <button id="inc">Púlsame</button>
      <span id="count">0</span>
    </section>

    <section>
      <h2>Perro</h2>
      <div id="dog-wrap">
        <svg id="dog" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Perro">
          <ellipse cx="100" cy="150" rx="10" ry="6" fill="#00000022"/>
          <rect x="50" y="120" width="14" height="30" rx="6" fill="#c98a4b"/>
          <rect x="130" y="120" width="14" height="30" rx="6" fill="#c98a4b"/>
          <ellipse cx="100" cy="110" rx="55" ry="35" fill="#e0a25e"/>
          <path d="M40 100 Q15 90 25 70 Q45 75 55 95 Z" fill="#e0a25e"/>
          <circle cx="150" cy="90" r="32" fill="#e0a25e"/>
          <path d="M128 65 Q118 40 135 45 Q140 62 138 70 Z" fill="#c98a4b"/>
          <path d="M172 65 Q182 40 165 45 Q160 62 162 70 Z" fill="#c98a4b"/>
          <circle cx="140" cy="88" r="4" fill="#2b2b2b"/>
          <circle cx="160" cy="88" r="4" fill="#2b2b2b"/>
          <ellipse cx="150" cy="102" rx="8" ry="6" fill="#2b2b2b"/>
        </svg>
        <button id="jump">Saltar</button>
      </div>
    </section>

    <section>
      <h2>Lista</h2>
      <ul id="items">
        <li>Primer elemento</li>
        <li>Segundo elemento</li>
      </ul>
    </section>

    <footer>Sin build, sin dependencias. Todo vive en este fichero. — By Gonzalo</footer>
  </main>

  <script>
    var count = 0;
    var out = document.getElementById('count');
    document.getElementById('inc').addEventListener('click', function () {
      count += 1;
      out.textContent = count;
    });

    var dog = document.getElementById('dog');
    document.getElementById('jump').addEventListener('click', function () {
      dog.classList.remove('jump');
      void dog.offsetWidth; // reinicia la animación si se pulsa varias veces seguidas
      dog.classList.add('jump');
    });
    dog.addEventListener('animationend', function () {
      dog.classList.remove('jump');
    });
  </script>
</body>
</html>
