name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.number }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Early notice on the originating issue. There is nothing to show yet — this only says
      # the deployment started. The comment id is kept so the next step can edit it instead of
      # leaving two separate messages behind.
      - name: Announce that the preview is deploying
        if: github.event.action != 'closed'
        id: pending-comment
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issues = [...new Set([...body.matchAll(re)].map(m => Number(m[1])))];
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;
            const comments = [];
            for (const issue of issues) {
              const { data } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                body: `🚧 Deploying the preview for [PR #${prNumber}](${prUrl})…`,
              });
              comments.push({ issue, commentId: data.id });
            }
            core.setOutput("comments", JSON.stringify(comments));

      - uses: rossjrw/pr-preview-action@v1.8.1
        id: preview
        with:
          source-dir: ./
          # Wait until the GitHub Pages CDN actually serves the content before finishing, so we
          # never announce a URL that still 404s.
          wait-for-pages-deployment: "true"

      # The site is confirmed live, so turn the earlier notice into the finished one.
      - name: Update the comment with the preview link
        if: github.event.action != 'closed'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          COMMENTS_JSON: ${{ steps.pending-comment.outputs.comments }}
        with:
          script: |
            const comments = JSON.parse(process.env.COMMENTS_JSON || "[]");
            const previewUrl = process.env.PREVIEW_URL;
            for (const { commentId } of comments) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: `✅ Preview deployed: ${previewUrl}`,
              });
            }
